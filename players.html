<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Active Players - AI Survivor</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Inter:wght@300;400;600;800&display=swap"
        rel="stylesheet">

    <style>
        :root {
            --bg-color: #0d0d12;
            --card-bg: #1a1a20;
            --border-color: rgba(255, 255, 255, 0.08);
            --accent-color: #ffd700;
            --text-main: #ffffff;
            --text-muted: #8888aa;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: var(--bg-color);
            color: var(--text-main);
            font-family: 'Inter', system-ui, sans-serif;
            padding-bottom: 40px;
        }

        h1,
        h2,
        h3 {
            font-family: 'Cinzel', serif;
            color: #fff;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        .page-header {
            margin-bottom: 30px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .page-title {
            font-size: 2.5rem;
            color: var(--text-main);
        }

        .back-link {
            color: var(--text-muted);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: color 0.2s;
            cursor: pointer;
        }

        .back-link:hover {
            color: #fff;
        }

        /* --- SEARCH CONTAINER --- */
        .controls-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            gap: 20px;
            flex-wrap: wrap;
        }

        .search-input {
            background: var(--card-bg);
            border: 1px dashed var(--border-color);
            color: #fff;
            padding: 12px 20px;
            border-radius: 8px;
            width: 100%;
            max-width: 400px;
            font-size: 0.95rem;
            font-family: 'Inter', sans-serif;
            outline: none;
            transition: all 0.2s ease;
        }

        .search-input:focus {
            border-color: var(--accent-color);
            border-style: solid;
            box-shadow: 0 0 12px rgba(255, 215, 0, 0.15);
        }

        /* --- PLAYERS GRID --- */
        .players-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .player-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--card-bg);
            border: 1px dashed var(--border-color);
            padding: 15px 25px;
            border-radius: 6px;
            transition: all 0.2s ease;
        }

        .player-row:hover {
            transform: translateY(-2px);
            background: rgba(255, 255, 255, 0.03);
            border-color: rgba(255, 255, 255, 0.2);
        }

        .player-left {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .player-avatar {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid rgba(255, 255, 255, 0.1);
        }

        .player-name {
            color: #fff;
            font-weight: 600;
            font-size: 1.1rem;
        }

        .player-sub {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-top: 2px;
        }

        .player-stats {
            display: flex;
            align-items: center;
            gap: 30px;
            font-family: 'Cinzel', serif;
            font-weight: bold;
            font-size: 1.2rem;
        }

        .stat-box {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .stat-v {
            color: var(--accent-color);
        }

        .stat-b {
            color: var(--text-muted);
        }

        .stat-pct {
            font-size: 0.95rem;
            color: #2ecc71;
            font-family: 'Inter', sans-serif;
            font-weight: 600;
            background: rgba(46, 204, 113, 0.1);
            padding: 4px 8px;
            border-radius: 4px;
            border: 1px solid rgba(46, 204, 113, 0.2);
        }

        .no-results {
            text-align: center;
            padding: 40px;
            color: var(--text-muted);
            font-size: 1.1rem;
            background: var(--card-bg);
            border: 1px dashed var(--border-color);
            border-radius: 6px;
        }
    </style>
</head>

<body>

    <div class="container">
        <div class="page-header">
            <h1 class="page-title">Active Players</h1>
            <a class="back-link" href="index.html">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M19 12H5M12 19l-7-7 7-7" />
                </svg>
                Back to Map
            </a>
        </div>

        <div class="controls-row">
            <div style="color: var(--text-muted); font-size: 0.95rem;" id="playerCount">
                Loading players list...
            </div>
            <input type="text" id="searchInput" placeholder="Search players or empires..." class="searchInput search-input">
        </div>

        <div id="playersList" class="players-list">
            <!-- Populated by JS -->
        </div>
    </div>

    <script>
        const SHEET_URL = "https://docs.google.com/spreadsheets/d/1pohzT2C9giZBJ_eH932_y_tXMCl8GjnpE5bJPgPL9ew/export?format=csv&gid=0";

        let players = [];

        function getLogo(teamName, sheetLogoUrl) {
            if (!teamName) return sheetLogoUrl || "";
            const cleanName = teamName.trim().toUpperCase().replace(/[\[\]]/g, "");
            const map = {
                "SAMURAI": "Empire Image/Samurai.png",
                "S-FORCE": "Empire Image/Stealth.png",
                "SFORCE": "Empire Image/Stealth.png",
                "RUSH-FED": "Empire Image/RushFed.png",
                "RUSHFED": "Empire Image/RushFed.png",
                "NEXUS ONE": "Empire Image/NexusOne.png",
                "NEXUSONE": "Empire Image/NexusOne.png",
                "D-WAR": "Empire Image/Dragon.png",
                "DWAR": "Empire Image/Dragon.png"
            };
            return map[cleanName] || sheetLogoUrl || "";
        }

        function parseCSV(str) {
            const result = [];
            let current = '';
            let inQuotes = false;
            for (let i = 0; i < str.length; i++) {
                const char = str[i];
                if (char === '"') inQuotes = !inQuotes;
                else if (char === ',' && !inQuotes) {
                    result.push(current.trim());
                    current = '';
                } else {
                    current += char;
                }
            }
            result.push(current.trim());
            return result.map(s => s.replace(/^"|"$/g, '').replace(/""/g, '"'));
        }

        function loadData() {
            fetch(SHEET_URL + "&t=" + Date.now())
                .then(res => res.text())
                .then(csv => {
                    const rows = csv.trim().split("\n").slice(1);
                    const statsMap = {};

                    rows.forEach(row => {
                        const parts = parseCSV(row);
                        if (parts.length < 1) return;
                        const zoneid = parts[0];
                        if (zoneid === "zoneid") return;

                        const teamNameA = parts[6];
                        const teamLogoA = getLogo(teamNameA, parts[4]);
                        const captainA = parts[5];
                        const scoreA = parseInt(parts[7]) || 0;

                        const teamNameB = parts[9];
                        const teamLogoB = getLogo(teamNameB, parts[11]);
                        const captainB = parts[10];
                        const scoreB = parseInt(parts[8]) || 0;

                        const isActive = parts[15]?.trim().toUpperCase() === "TRUE";

                        // Helper to register player stats
                        const registerPlayer = (player, empire, logo, isWinner) => {
                            if (!player) return;
                            const key = `${player}::${empire}`;
                            if (!statsMap[key]) {
                                statsMap[key] = {
                                    name: player,
                                    empire: empire,
                                    logo: logo,
                                    victories: 0,
                                    battles: 0
                                };
                            }
                            statsMap[key].battles++;
                            if (isActive && isWinner) {
                                statsMap[key].victories++;
                            }
                        };

                        if (teamNameA) {
                            const isAWinner = scoreA > scoreB || !teamNameB;
                            registerPlayer(captainA, teamNameA, teamLogoA, isAWinner);
                        }

                        if (teamNameB) {
                            const isBWinner = scoreB > scoreA || !teamNameA;
                            registerPlayer(captainB, teamNameB, teamLogoB, isBWinner);
                        }
                    });

                    // Convert map to array
                    players = Object.values(statsMap)
                        .filter(p => p.name)
                        .sort((a, b) => {
                            if (b.victories !== a.victories) {
                                return b.victories - a.victories;
                            }
                            return b.battles - a.battles; // Tie-breaker: total battles
                        });

                    renderPlayers(players);
                })
                .catch(console.error);
        }

        function renderPlayers(data) {
            const list = document.getElementById("playersList");
            const countEl = document.getElementById("playerCount");

            countEl.innerText = `${data.length} player(s) found`;

            if (data.length === 0) {
                list.innerHTML = `<div class="no-results">No players found matching that search.</div>`;
                return;
            }

            list.innerHTML = data.map(p => {
                const winRate = p.battles > 0 ? Math.round((p.victories / p.battles) * 100) : 0;
                return `
                <div class="player-row">
                    <div class="player-left">
                        <img src="${p.logo}" class="player-avatar" onerror="this.src='data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSI0OCIgaGVpZ2h0PSI0OCIgZmlsbD0iIzMzMyI+PHJlY3Qgd2lkdGg9IjEwMCUiIGhlaWdodD0iMTAwJSIvPjwvc3ZnPg=='">
                        <div>
                            <div class="player-name">${p.name}</div>
                            <div class="player-sub">${p.empire}</div>
                        </div>
                    </div>
                    <div class="player-stats">
                        <div class="stat-box" title="Victories/Territories">
                            ${p.victories} <span class="stat-v" style="font-size: 1.2rem;">V</span>
                        </div>
                        <div class="stat-box" title="Total Assignments" style="margin-left: 20px;">
                            ${p.battles} <span class="stat-b" style="font-size: 1.2rem;">⚔️</span>
                        </div>
                        <div class="stat-pct" title="Win Rate" style="margin-left: 20px;">
                            ${winRate}% WR
                        </div>
                    </div>
                </div>`;
            }).join("");
        }

        // Search listener
        document.getElementById("searchInput").addEventListener("input", (e) => {
            const query = e.target.value.toLowerCase().trim();
            if (!query) {
                renderPlayers(players);
                return;
            }

            const filtered = players.filter(p => 
                p.name.toLowerCase().includes(query) || 
                p.empire.toLowerCase().includes(query)
            );
            renderPlayers(filtered);
        });

        loadData();
    </script>
</body>

</html>
