<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Empires - AI Survivor</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Inter:wght@300;400;600;800&display=swap"
        rel="stylesheet">

    <style>
        :root {
            --bg-color: #0d0d12;
            --card-bg: #1a1a20;
            --border-color: rgba(255, 255, 255, 0.08);
            --accent-color: #ffd700;
            --text-main: #ffffff;
            --text-muted: #8888aa;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: var(--bg-color);
            color: var(--text-main);
            font-family: 'Inter', system-ui, sans-serif;
            padding-bottom: 40px;
        }

        h1,
        h2,
        h3 {
            font-family: 'Cinzel', serif;
            color: #fff;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        .page-header {
            margin-bottom: 30px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        .page-title {
            font-size: 2.5rem;
            color: var(--text-main);
        }

        /* --- UNIFIED TOP NAV --- */
        .site-nav {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .nav-tab {
            color: var(--text-muted);
            text-decoration: none;
            padding: 8px 14px;
            border-radius: 6px;
            font-size: 0.9rem;
            font-weight: 500;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-color);
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .nav-tab:hover {
            color: #fff;
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.2);
        }

        .nav-tab.active {
            color: var(--accent-color);
            background: rgba(255, 215, 0, 0.08);
            border-color: rgba(255, 215, 0, 0.3);
            font-weight: 600;
        }

        .back-link {
            color: var(--text-muted);
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s;
            cursor: pointer;
            padding: 6px 12px;
            border-radius: 6px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--border-color);
            margin-bottom: 20px;
            font-size: 0.9rem;
        }

        .back-link:hover {
            color: #fff;
            background: rgba(255, 255, 255, 0.08);
        }

        /* --- EMPIRE LIST GRID --- */
        .empires-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
        }

        .empire-card {
            background: var(--card-bg);
            border: 1px dashed var(--border-color);
            border-radius: 8px;
            padding: 25px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
        }

        .empire-card:hover {
            transform: translateY(-5px);
            background: rgba(255, 255, 255, 0.05);
            border-color: rgba(255, 255, 255, 0.2);
        }

        .empire-logo {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid rgba(255, 255, 255, 0.1);
            margin-bottom: 15px;
        }

        .empire-name {
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--accent-color);
            margin-bottom: 5px;
        }

        .empire-meta {
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        /* --- DETAIL VIEW --- */
        .detail-view {
            display: none;
            animation: fadeIn 0.3s ease;
        }

        .detail-view.active {
            display: block;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .profile-header {
            display: flex;
            gap: 30px;
            background: var(--card-bg);
            border: 1px dashed var(--border-color);
            padding: 30px;
            border-radius: 8px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .profile-logo {
            width: 140px;
            height: 140px;
            background: #000;
            border: 1px solid rgba(255, 255, 255, 0.2);
            object-fit: cover;
        }

        .profile-info {
            flex: 1;
        }

        .profile-name {
            font-size: 2rem;
            font-family: 'Cinzel', serif;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .stats-table {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
        }

        .stat-item {
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        .stat-item strong {
            color: #fff;
            margin-left: 5px;
        }

        .section-title {
            font-size: 1.5rem;
            color: #d15d43;
            /* Similar to sample reddish color */
            margin-bottom: 20px;
            font-family: 'Cinzel', serif;
        }

        /* PLAYERS LIST */
        .players-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .player-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--card-bg);
            border: 1px dashed var(--border-color);
            padding: 15px 20px;
            border-radius: 4px;
        }

        .player-left {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .player-avatar {
            width: 40px;
            height: 40px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .player-name {
            color: #fff;
            font-weight: 600;
            font-size: 1rem;
        }

        .player-sub {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .player-stats {
            display: flex;
            gap: 20px;
            font-family: 'Cinzel', serif;
            font-weight: bold;
            font-size: 1.2rem;
        }

        .stat-box {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .stat-v {
            color: var(--accent-color);
        }

        .stat-b {
            color: var(--text-muted);
        }
    </style>
</head>

<body>

    <div class="container">
        <div class="page-header">
            <div>
                <h1 class="page-title" id="pageTitle">Empires</h1>
            </div>
            <div class="site-nav">
                <a href="index.html" class="nav-tab">🗺️ Map</a>
                <a href="empires.html" class="nav-tab active">👑 Empires</a>
                <a href="players.html" class="nav-tab">👥 Players</a>
                <a href="battles.html" class="nav-tab">⚔️ Battles</a>
            </div>
        </div>

        <!-- MAIN EMPIRE LIST -->
        <div id="empiresGrid" class="empires-grid">
            <div style="grid-column: 1/-1; text-align: center; color: var(--text-muted); padding: 40px;">
                Loading Empires...
            </div>
        </div>

        <!-- DETAIL VIEW -->
        <div id="detailView" class="detail-view">
            <button class="back-link" onclick="goBack()" style="outline: none; border-radius: 6px;">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M19 12H5M12 19l-7-7 7-7" />
                </svg>
                <span>Back to All Empires</span>
            </button>
            <div id="detailContent">
                <!-- Injected by JS -->
            </div>
        </div>

    </div>

    <script>
        const SHEET_URL = "https://docs.google.com/spreadsheets/d/1pohzT2C9giZBJ_eH932_y_tXMCl8GjnpE5bJPgPL9ew/export?format=csv&gid=0";
        const DEFAULT_LOGO_SVG = 'data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSI0OCIgaGVpZ2h0PSI0OCIgZmlsbD0iIzMzMyI+PHJlY3Qgd2lkdGg9IjEwMCUiIGhlaWdodD0iMTAwJSIvPjwvc3ZnPg==';

        let allData = [];
        let empires = {};

        function getLogo(teamName, sheetLogoUrl) {
            if (!teamName) return sheetLogoUrl || DEFAULT_LOGO_SVG;
            const cleanName = teamName.trim().toUpperCase().replace(/[\[\]]/g, "");
            const map = {
                "SAMURAI": "Empire Image/Samurai.png",
                "S-FORCE": "Empire Image/Stealth.png",
                "SFORCE": "Empire Image/Stealth.png",
                "RUSH-FED": "Empire Image/RushFed.png",
                "RUSHFED": "Empire Image/RushFed.png",
                "NEXUS ONE": "Empire Image/NexusOne.png",
                "NEXUSONE": "Empire Image/NexusOne.png",
                "D-WAR": "Empire Image/Dragon.png",
                "DWAR": "Empire Image/Dragon.png"
            };
            return map[cleanName] || sheetLogoUrl || DEFAULT_LOGO_SVG;
        }

        function parseCSV(str) {
            const result = [];
            let current = '';
            let inQuotes = false;
            for (let i = 0; i < str.length; i++) {
                const char = str[i];
                if (char === '"') inQuotes = !inQuotes;
                else if (char === ',' && !inQuotes) {
                    result.push(current.trim());
                    current = '';
                } else {
                    current += char;
                }
            }
            result.push(current.trim());
            return result.map(s => s.replace(/^"|"$/g, '').replace(/""/g, '"'));
        }

        function loadData() {
            fetch(SHEET_URL + "&t=" + Date.now())
                .then(res => res.text())
                .then(csv => {
                    const rows = csv.trim().split("\n").slice(1);
                    empires = {};

                    rows.forEach(row => {
                        const parts = parseCSV(row);
                        if (parts.length < 1) return;
                        const zoneid = parts[0];
                        if (zoneid === "zoneid") return;

                        const teamNameA = parts[6];
                        const teamLogoA = getLogo(teamNameA, parts[4]);
                        const captainA = parts[5];
                        const scoreA = parseInt(parts[7]) || 0;

                        const teamNameB = parts[9];
                        const teamLogoB = getLogo(teamNameB, parts[11]);
                        const captainB = parts[10];
                        const scoreB = parseInt(parts[8]) || 0;

                        const isActive = parts[15]?.trim().toUpperCase() === "TRUE";

                        const initEmpire = (name, logo) => {
                            if (!empires[name]) {
                                empires[name] = {
                                    name: name,
                                    logo: logo,
                                    territories: 0,
                                    captains: new Set(),
                                    activePlayers: new Set(),
                                    totalBattles: 0,
                                    victories: 0,
                                    playerStats: {}
                                };
                            }
                        };

                        if (teamNameA) initEmpire(teamNameA, teamLogoA);
                        if (teamNameB) initEmpire(teamNameB, teamLogoB);

                        if (teamNameA) {
                            const emp = empires[teamNameA];
                            emp.totalBattles++;
                            if (captainA) {
                                emp.captains.add(captainA);
                                if (!emp.playerStats[captainA]) {
                                    emp.playerStats[captainA] = { v: 0, b: 0 };
                                }
                                emp.playerStats[captainA].b++;
                            }
                        }

                        if (teamNameB) {
                            const emp = empires[teamNameB];
                            emp.totalBattles++;
                            if (captainB) {
                                emp.captains.add(captainB);
                                if (!emp.playerStats[captainB]) {
                                    emp.playerStats[captainB] = { v: 0, b: 0 };
                                }
                                emp.playerStats[captainB].b++;
                            }
                        }

                        if (isActive) {
                            if (teamNameA && teamNameB) {
                                if (scoreA > scoreB) {
                                    empires[teamNameA].territories++;
                                    empires[teamNameA].victories++;
                                    if (captainA) {
                                        empires[teamNameA].playerStats[captainA].v++;
                                        empires[teamNameA].activePlayers.add(captainA);
                                    }
                                } else if (scoreB > scoreA) {
                                    empires[teamNameB].territories++;
                                    empires[teamNameB].victories++;
                                    if (captainB) {
                                        empires[teamNameB].playerStats[captainB].v++;
                                        empires[teamNameB].activePlayers.add(captainB);
                                    }
                                } else {
                                    // Draw: mark captains active
                                    if (captainA) empires[teamNameA].activePlayers.add(captainA);
                                    if (captainB) empires[teamNameB].activePlayers.add(captainB);
                                }
                            } else if (teamNameA) {
                                empires[teamNameA].territories++;
                                empires[teamNameA].victories++;
                                if (captainA) {
                                    empires[teamNameA].playerStats[captainA].v++;
                                    empires[teamNameA].activePlayers.add(captainA);
                                }
                            } else if (teamNameB) {
                                empires[teamNameB].territories++;
                                empires[teamNameB].victories++;
                                if (captainB) {
                                    empires[teamNameB].playerStats[captainB].v++;
                                    empires[teamNameB].activePlayers.add(captainB);
                                }
                            }
                        }
                    });

                    renderGrid();
                    handleHashChange();
                })
                .catch(console.error);
        }

        function renderGrid() {
            const grid = document.getElementById("empiresGrid");
            const list = Object.values(empires).sort((a, b) => b.territories - a.territories);

            if (list.length === 0) {
                grid.innerHTML = '<div style="grid-column: 1/-1; text-align: center; color: var(--text-muted); padding: 40px;">No Empires Found</div>';
                return;
            }

            grid.innerHTML = list.map(emp => `
            <div class="empire-card" onclick="showDetail('${emp.name.replace(/'/g, "\\'")}')">
                <img src="${emp.logo}" class="empire-logo" onerror="this.src='${DEFAULT_LOGO_SVG}'">
                <div class="empire-name">${emp.name}</div>
                <div class="empire-meta">${emp.territories} Territories</div>
                <div class="empire-meta" style="font-size: 0.8rem; margin-top: 5px;">${emp.captains.size} Players</div>
            </div>
        `).join("");
        }

        function showDetail(name, updateHash = true) {
            const emp = empires[name];
            if (!emp) return;

            if (updateHash) {
                window.location.hash = encodeURIComponent(name);
            }

            document.getElementById("empiresGrid").style.display = "none";
            document.getElementById("detailView").classList.add("active");
            document.getElementById("pageTitle").innerText = emp.name;

            const playersHtml = Array.from(emp.captains).map(cap => {
                const stats = emp.playerStats[cap] || { v: 0, b: 0 };
                return `
            <div class="player-row">
                <div class="player-left">
                     <img src="${emp.logo}" class="player-avatar" onerror="this.src='${DEFAULT_LOGO_SVG}'">
                     <div>
                        <div class="player-name">${cap}</div>
                        <div class="player-sub">${emp.name}</div>
                     </div>
                </div>
                <div class="player-stats">
                    <div class="stat-box" title="Victories">
                        ${stats.v} <span class="stat-v" style="color: gold; font-size: 1.2rem;">V</span>
                    </div>
                    <div class="stat-box" title="Total Assignments" style="margin-left: 20px;">
                        ${stats.b} <span class="stat-b" style="color: #888; font-size: 1.2rem;">⚔️</span>
                    </div>
                </div>
            </div>`;
            }).join("");

            const content = document.getElementById("detailContent");
            content.innerHTML = `
            <div class="profile-header">
                 <img src="${emp.logo}" class="profile-logo" onerror="this.src='${DEFAULT_LOGO_SVG}'">
                 <div class="profile-info">
                    <div style="font-size: 0.9rem; color: #d15d43; text-transform: uppercase; font-weight: bold; margin-bottom: 5px;">Empire Profile</div>
                    <div class="profile-name">
                        ${emp.name}
                    </div>
                    
                    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; margin-top: 15px; color: #aaa; font-size: 0.9rem;">
                         <div>Total Players: <strong style="color: #fff">${emp.captains.size}</strong></div>
                         <div>Active Players: <strong style="color: #fff">${emp.activePlayers.size}</strong></div>
                         <div>Total Battles: <strong style="color: #fff">${emp.totalBattles}</strong></div>
                         <div>Victories: <strong style="color: #fff">${emp.victories}</strong></div>
                         <div>Territories: <strong style="color: #fff">${emp.territories}</strong></div>
                    </div>
                 </div>
            </div>

            <div class="section-title">Players</div>
            <div class="players-list">
                ${playersHtml.length > 0 ? playersHtml : '<div style="color:var(--text-muted); padding:20px;">No players listed.</div>'}
            </div>
        `;
        }

        function goBack(updateHash = true) {
            if (updateHash && window.location.hash) {
                history.pushState("", document.title, window.location.pathname + window.location.search);
            }
            document.getElementById("empiresGrid").style.display = "grid";
            document.getElementById("detailView").classList.remove("active");
            document.getElementById("pageTitle").innerText = "Empires";
        }

        function handleHashChange() {
            const rawHash = window.location.hash.replace(/^#/, '').trim();
            if (!rawHash) {
                goBack(false);
                return;
            }
            const name = decodeURIComponent(rawHash);
            if (empires[name]) {
                showDetail(name, false);
            }
        }

        window.addEventListener("hashchange", handleHashChange);
        loadData();

    </script>
</body>

</html>
